# ======================== PLUGINS ======================== #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pattern picker: capture pane content, extract patterns, hints in a popup
# Works over nvim and other TUI apps (uses display-popup, no pane swap)
# The script is the launcher: it captures the panes before opening its popup
# (a popup over a zoomed pane makes TUIs like pi redraw, see tmux-hint-lib.sh)
# prefix+e → copy selection to buffer + system clipboard
# prefix+q → open URL in browser
bind -N "Copy a URL, path, hash, UUID or IP from the screen (hints)" e run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-thumbs-wrapper.sh copy $state'
bind -N "Open a URL from the screen in the browser (hints)" q run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-thumbs-wrapper.sh open $state'

# Jump: hint every word on screen; typing a hint puts the copy-mode cursor
# there (any visible pane; extends an active selection)
# prefix+j from normal mode, s inside copy mode
bind -N "Jump to a word on screen in copy mode (hints)" j run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-jump.sh $state'
bind -N "Jump to a word on screen (hints)" -T copy-mode-vi s run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; $HOME/.config/tmux/utils/tmux-jump.sh $state'
# Line jump: same picker, hints on the start of every line, cursor to column 0
bind -N "Jump to a line on screen in copy mode (hints)" m run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-jump.sh --line $state'
bind -N "Jump to a line on screen (hints)" -T copy-mode-vi m run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; $HOME/.config/tmux/utils/tmux-jump.sh --line $state'


