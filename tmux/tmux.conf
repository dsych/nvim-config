# ======================== ENVIRONMENT DETECTION ======================== #
# Single conditional: local vs SSH
if-shell '[ -n "$SSH_CONNECTION" ]' {
    # Remote: safe prefix + terminal type
    set-option -g prefix C-a
    unbind C-b
    bind C-a send-prefix
    # set -g default-terminal "xterm-256color"

    # Default green status bar for remote sessions (see STATUS COLOUR below)
    set -g @status-bg green
    set -g @status-fg black

    # Show mutagen sync indicator in status line when agent is active
    set -g status-right '#{?#(pgrep -f "[m]utagen-agent" >/dev/null 2>&1 && echo 1),🔄 ,}%Y-%m-%d %H:%M'
} {
    if-shell '[ "$FORCE_NATURAL_PREFIX_LOCALLY" = "true" ]' {
        # Local: default prefix + native terminal + SSH-only features
        set-option -g prefix C-a
        unbind C-b
        bind C-a send-prefix
    } {
        # Local: default prefix + native terminal + SSH-only features
        set-option -g prefix C-b
        unbind C-a
        bind C-b send-prefix
    }

    # set -g default-terminal "tmux-256color"

    # Transparent status bar for local (see STATUS COLOUR below)
    set -g @status-bg default
    set -g @status-fg default

    # SSH target picker — runs fzf in a temporary window, then exec's into SSH
    bind R new-window "$HOME/.config/tmux/utils/connect.sh"

    # Ollama model picker (requires local ollama)
    bind-key g display-popup 'model=$(ollama ls | tail -n+2 | cut  -f1 | fzf); ollama run $model'

    # Battery + Spotify + date/time
    set -g status-right '#($HOME/.config/tmux/utils/tmux-spotify.sh) | #($HOME/.config/tmux/utils/tmux-battery.sh) | %Y-%m-%d %H:%M'

    # Launch URL watcher daemon (singleton — skips if already running)
    run-shell -b '$HOME/.config/tmux/utils/tmux-url-watcher.sh'
}

# ======================== GENERAL SETTINGS ======================== #
set -g set-clipboard on
set -g allow-passthrough on
set -sg repeat-time 300                   #  ncrease repeat timeout
set -g focus-events on
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time
set -g base-index 1           # start windows numbering at 1
set -g pane-base-index 1     # make pane numbering consistent with windows
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-interval 5
set -g status-right-length 120
set -g status-left-length 30
set -g detach-on-destroy previous
set -g window-status-separator ' | '
set -g window-status-current-format '>#I:#{?#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}},R,L}:#W#{?window_zoomed_flag, 🔍,}<'
set -g window-status-format '#I:#{?#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}},R,L}:#W'
set -g status-left '[#S] '
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}"
set -g renumber-windows on    # renumber windows when a window is closed
set -g mouse on
set -s escape-time 0
set-option -g status-position bottom

# ======================== VI MODE & COPY ======================== #
set-window-option -g mode-keys vi
set-window-option -g mode-style 'fg=black,bg=yellow,bold'

bind-key -T copy-mode-vi 'v' send -X begin-selection
# Yank without leaving copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode     y send-keys -X copy-pipe

# Escape clears selection (no-op if no selection), stays in copy mode. In the
# link peek pane (tmux-link-peek.sh), q and Escape close it instead.
bind-key -T copy-mode-vi Escape if-shell -F '#{@link-peek-float}' { run-shell '$HOME/.config/tmux/utils/tmux-link-peek.sh close #{pane_id}' } { send-keys -X clear-selection }
bind-key -T copy-mode-vi q if-shell -F '#{@link-peek-float}' { run-shell '$HOME/.config/tmux/utils/tmux-link-peek.sh close #{pane_id}' } { send-keys -X cancel }

# Scroll bindings in copy mode
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi U send-keys -X page-up
bind-key -T copy-mode-vi D send-keys -X page-down

# Also for emacs-style copy mode
bind-key -T copy-mode u send-keys -X halfpage-up
bind-key -T copy-mode d send-keys -X halfpage-down
bind-key -T copy-mode U send-keys -X page-up
bind-key -T copy-mode D send-keys -X page-down

# Cursor line: highlight the line under the copy-mode cursor. Uses the copy-mode
# mark (whole marked line is drawn in copy-mode-mark-style) and keeps the mark
# on the cursor: utils/tmux-copy-cursorline.sh (run at the end of this file)
# wraps the movement bindings, this hook sets it on entry. Costs jump-to-mark.
# set -g @copy-cursorline off to disable.
set -g copy-mode-mark-style 'bg=colour237,fg=colour255'
set-hook -g pane-mode-changed {
    if-shell -F '#{&&:#{!=:#{@copy-cursorline},off},#{||:#{==:#{pane_mode},copy-mode},#{==:#{pane_mode},view-mode}}}' {
        send-keys -X set-mark
    }
    # Link peek: entering copy mode on a link shows it, leaving hides it
    if-shell -F '#{&&:#{!=:#{@link-peek},off},#{&&:#{!:#{@link-peek-float}},#{!=:#{copy_cursor_hyperlink},#{@link-peek-url}}}}' {
        set-option -wF @link-peek-url '#{copy_cursor_hyperlink}'
        run-shell -b '$HOME/.config/tmux/utils/tmux-link-peek.sh update #{pane_id}'
    }
}

# Link peek: programs can print hyperlinks (OSC 8) whose visible text hides the
# URL. In copy mode, while the cursor is on one, its URL is shown in a small
# floating pane in the bottom-right corner: a real pane, so prefix+q / prefix+e
# offer it and prefix+j can jump into it to select it. utils/tmux-link-peek.sh;
# the movement bindings are wrapped by tmux-copy-cursorline.sh.
# set -g @link-peek off to disable (then reload).
set -g @link-peek-border-style 'fg=colour45'

# ======================== STATUS COLOUR ======================== #
# Yellow while the *active* pane is in copy (or any other) mode, otherwise the
# environment's base colour. status-style is a format evaluated on every status
# redraw against each client's current window/active pane, so it follows pane
# and window switches with no hooks or global state to go stale.
set -g status-style 'bg=#{?pane_in_mode,yellow,#{@status-bg}},fg=#{?pane_in_mode,black,#{@status-fg}}'

# ======================== PANE MANAGEMENT ======================== #
# Splits — SSH-aware: if current pane is in an SSH session, new pane opens on same remote
bind-key | run-shell "$HOME/.config/tmux/utils/smart-split.sh -h"
bind-key - run-shell "$HOME/.config/tmux/utils/smart-split.sh -v"
bind % run-shell "$HOME/.config/tmux/utils/smart-split.sh -h"
bind '"' run-shell "$HOME/.config/tmux/utils/smart-split.sh -v"

# Resize (prefix + H/J/K/L)
bind-key -r O select-pane -t -
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# Navigation (Alt+hjkl, no prefix needed)
# Cursor-position-aware: targets the pane under the cursor's column/row. No wrap-around.
bind -n M-H if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys M-H" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh L'"
bind -n M-J if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys M-J" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh D'"
bind -n M-K if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys M-K" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh U'"
bind -n M-L if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys M-L" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh R'"

# macOS: Option key sends Unicode chars (US keyboard) — always bind since terminal is macOS
bind -n ˙ if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys ˙" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh L'"
bind -n ∆ if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys ∆" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh D'"
bind -n ˚ if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys ˚" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh U'"
bind -n ¬ if -F "#{||:#{@ssh_target},#{==:#{pane_current_command},ssh}}" "send-keys ¬" "run-shell '$HOME/.config/tmux/utils/tmux-smart-nav.sh R'"

# ======================== MISC BINDINGS ======================== #
bind f source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded!"
# Session picker: one key per session. Replaces the default choose-tree -Zs.
# Opens on the previous session, so prefix s Enter flips between the two
# sessions you're working in. prefix t is still the full tree.
# C-l was the old picker key (prefix L, tmux's default last-session, is resize now)
unbind-key C-l
bind-key s run-shell -b '$HOME/.config/tmux/utils/tmux-session-menu.sh "#{client_name}"'

# New windows inherit current pane's working directory
bind c new-window -c "#{pane_current_path}"

# Set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"

# mwinit in a split pane — closes on success, waits for Enter on failure
bind W split-window -v 'mwinit -f'

# Command palette (fzf) - capture pane_id before popup steals context
bind \; run-shell -b 'pane="#{pane_id}"; sleep 0.1; tmux display-popup -w 80% -h 70% -E "$HOME/.config/tmux/utils/tmux-command-palette.sh $pane"'

# Key binding finder (fzf popup over every key table). Replaces the default
# `list-keys -N` viewer on prefix ?; Enter replays prefix/root bindings.
bind ? run-shell -b 'client="#{client_name}"; sleep 0.1; tmux display-popup -w 90% -h 80% -E "$HOME/.config/tmux/utils/tmux-keys.sh $client"'

# Session/window tree picker
bind t choose-tree

# C-j / C-k move down / up in tmux's built-in pickers (choose-tree/session/
# window, buffers, clients, options). These modes have no key table of their
# own, so keys reach the root table first; everywhere else the key is passed
# through to the pane unchanged.
bind -n C-j if-shell -F '#{m/r:^(tree|buffer|client|options)-mode$,#{pane_mode}}' { send-keys Down } { send-keys C-j }
bind -n C-k if-shell -F '#{m/r:^(tree|buffer|client|options)-mode$,#{pane_mode}}' { send-keys Up } { send-keys C-k }

# Dev layout: editor (top) + agent (bottom-left) + shell (bottom-right)
bind v run-shell '"$HOME/.config/tmux/utils/tmux-dev-layout.sh" "#{pane_id}"'

# Auto-resize bottom dev-layout panes: focused pane gets 95% width.
# Skipped while zoomed: resize-pane always unzooms, and focus-in also fires on
# popup close / window switch / terminal refocus.
set-hook -g pane-focus-in {
    if-shell -F "#{&&:#{@dev-layout-bottom},#{!:#{window_zoomed_flag}}}" {
        run-shell -b "tmux resize-pane -t '#{pane_id}' -x 95%"
    }
}

# Focus flash: when a pane gains focus (pane switch, window switch, popup close,
# terminal refocus) tint its background and brighten its border for a moment,
# so the eye lands on the new cursor. The tint only shows on cells with the
# default background (apps like nvim that paint their own background keep it),
# hence the border too. Kept in its own hook slot: the plain set-hook above
# clears the whole pane-focus-in array, so this must come after it.
# set -g @focus-flash off to disable.
set -g @focus-flash-style 'bg=colour236'
set -g @focus-flash-border 'fg=brightwhite,bold'
set -g @focus-flash-duration 0.12   # seconds
#
# Entering a different window (vs. moving between panes of the same window) gets
# a stronger double-blink: brighter tint, orange border, on-off-on. Detected by
# comparing #{window_id} with the window of the previous flash, so it doesn't
# depend on hook ordering. Popup close / terminal refocus stay in the same
# window and get the subtle flash.
set -g @focus-flash-window-style 'bg=colour239'
set -g @focus-flash-window-border 'fg=colour208,bold'
set -g @focus-flash-window-duration 0.1   # seconds per phase (on, off, on)
set-hook -g 'pane-focus-in[10]' {
    if-shell -F '#{!=:#{@focus-flash},off}' {
        if-shell -F '#{!=:#{@focus-flash-last-window},#{window_id}}' {
            set -Fp window-active-style '#{@focus-flash-window-style}'
            set -Fw pane-active-border-style '#{@focus-flash-window-border}'
            run-shell -b "sleep #{@focus-flash-window-duration}; tmux set -p -t '#{pane_id}' -u window-active-style \\; set -w -t '#{pane_id}' -u pane-active-border-style; sleep #{@focus-flash-window-duration}; tmux set -p -t '#{pane_id}' window-active-style '#{@focus-flash-window-style}' \\; set -w -t '#{pane_id}' pane-active-border-style '#{@focus-flash-window-border}'; sleep #{@focus-flash-window-duration}; tmux set -p -t '#{pane_id}' -u window-active-style \\; set -w -t '#{pane_id}' -u pane-active-border-style"
        } {
            set -Fp window-active-style '#{@focus-flash-style}'
            set -Fw pane-active-border-style '#{@focus-flash-border}'
            run-shell -b "sleep #{@focus-flash-duration}; tmux set -p -t '#{pane_id}' -u window-active-style \\; set -w -t '#{pane_id}' -u pane-active-border-style"
        }
        set -gF @focus-flash-last-window '#{window_id}'
    }
}

# tmux-resurrect drops pane user options, so persist the @dev-layout-bottom
# tags in the snapshot and re-apply them after restore (keeps auto-resize working)
set -g @resurrect-hook-post-save-layout '$HOME/.config/tmux/utils/tmux-dev-layout-resurrect.sh save'
set -g @resurrect-hook-post-restore-all '$HOME/.config/tmux/utils/tmux-dev-layout-resurrect.sh restore'

# Restart pi agents on restore (resurrect only restarts processes on its list;
# the defaults are editors/pagers). pi retitles itself to plain "pi", so the
# saved command has no args/env; restart via the fish w_arch function instead,
# which resumes the directory's latest session (pi -c). The inner double quotes
# are required: resurrect evals this list, and a bare -> would be a redirect.
set -g @resurrect-processes '"pi->w_arch"'

# Agent Deck in new window
bind a new-window 'AGENT_DECK_ALLOW_OUTER_TMUX=1 agent-deck'


# Forward C-q only when inside an agent-deck pane
bind -n C-q if-shell -F '#{==:#{pane_current_command},agent-deck}' 'send-keys C-q' 'select-pane -t :.+'

# ======================== TERMINAL OVERRIDES ======================== #
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

