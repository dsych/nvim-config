# set -g @plugin 'omerxx/tmux-floax'
# set -g @floax-bind 'g'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Notes for the plugins' keys (prefix ? shows them). bind -N without a command
# only sets the note, and does nothing when the plugin isn't installed.
bind -N "Install the plugins listed in tmux.conf (TPM)" I
bind -N "Update plugins (TPM)" U
bind -N "Remove plugins no longer listed in tmux.conf (TPM)" M-u
bind -N "Save sessions to disk (tmux-resurrect)" C-s
bind -N "Restore saved sessions (tmux-resurrect)" C-r

# After TPM so plugin copy-mode bindings get the cursor line too
run-shell '$HOME/.config/tmux/utils/tmux-copy-cursorline.sh'
