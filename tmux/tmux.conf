# ======================== PLUGINS ======================== #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pattern picker: capture pane content, extract patterns, fzf in popup
# Works over nvim and other TUI apps (uses display-popup, no pane swap)
# prefix+e → copy selection to buffer + system clipboard
# prefix+q → open URL in browser
bind e run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; tmux display-popup -B -w 100% -h 100% -E "$HOME/.config/tmux/utils/tmux-thumbs-wrapper.sh copy $state"'
bind q run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; tmux display-popup -B -w 100% -h 100% -E "$HOME/.config/tmux/utils/tmux-thumbs-wrapper.sh open $state"'

# Jump: hint every word on screen; typing a hint puts the copy-mode cursor
# there (any visible pane; extends an active selection)
# prefix+j from normal mode, s inside copy mode
bind j run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-jump.sh $state'
bind -T copy-mode-vi s run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; $HOME/.config/tmux/utils/tmux-jump.sh $state'
# Line jump: same picker, hints on the start of every line, cursor to column 0
bind m run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; sleep 0.1; $HOME/.config/tmux/utils/tmux-jump.sh --line $state'
bind -T copy-mode-vi m run-shell -b 'state="#{pane_id} #{pane_in_mode} #{?#{scroll_position},#{scroll_position},0} #{pane_height} #{window_zoomed_flag}"; $HOME/.config/tmux/utils/tmux-jump.sh --line $state'


